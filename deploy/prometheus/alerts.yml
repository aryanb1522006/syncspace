groups:
  - name: syncspace-api
    rules:
      - alert: SyncSpaceApiDown
        expr: up{job="syncspace-api"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: SyncSpace API is unavailable
          description: Prometheus has been unable to scrape the API for two minutes.

      - alert: SyncSpaceHighServerErrorRate
        expr: >-
          sum(rate(syncspace_http_request_duration_seconds_count{status_code=~"5.."}[5m]))
          /
          clamp_min(sum(rate(syncspace_http_request_duration_seconds_count[5m])), 0.001)
          > 0.05
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: SyncSpace server error rate is above 5%
          description: More than 5% of API requests have returned 5xx responses for ten minutes.

      - alert: SyncSpaceSlowP95
        expr: >-
          histogram_quantile(0.95,
            sum by (le) (rate(syncspace_http_request_duration_seconds_bucket[5m]))) > 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: SyncSpace p95 API latency exceeds one second
          description: The five-minute p95 request latency has remained above one second for ten minutes.
