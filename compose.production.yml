name: syncspace

services:
  postgres:
    image: postgres:17.10-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: syncspace
      POSTGRES_USER: syncspace
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U syncspace -d syncspace"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [private]

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-06T17-38-46Z
    command: server /data --console-address ":9001"
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [private]

  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-07-21T05-28-08Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" &&
        mc mb --ignore-existing local/syncspace-resumes &&
        mc anonymous set none local/syncspace-resumes
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    networks: [private]

  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    command: ["sh", "-c", "node src/config/migrate.js && node src/server.js"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      DATABASE_SSL_MODE: disable
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-20}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-2h}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?GOOGLE_CLIENT_ID is required}
      AUTH_ALLOWED_EMAIL_DOMAIN: ${AUTH_ALLOWED_EMAIL_DOMAIN:-thapar.edu}
      PASSWORD_AUTH_ENABLED: ${PASSWORD_AUTH_ENABLED:-false}
      CLIENT_ORIGIN: https://${SITE_DOMAIN:?SITE_DOMAIN is required}
      TRUST_PROXY: "true"
      DEFAULT_COLLEGE_ID: ${DEFAULT_COLLEGE_ID:-1}
      STORAGE_DRIVER: s3
      S3_BUCKET: syncspace-resumes
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ENDPOINT: http://minio:9000
      S3_FORCE_PATH_STYLE: "true"
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      S3_SERVER_SIDE_ENCRYPTION: AES256
      S3_PRESIGN_EXPIRES_SECONDS: ${S3_PRESIGN_EXPIRES_SECONDS:-300}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      METRICS_ENABLED: "true"
      METRICS_TOKEN: ${METRICS_TOKEN:?METRICS_TOKEN is required}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-300}
      AUTH_RATE_LIMIT_MAX: ${AUTH_RATE_LIMIT_MAX:-30}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/api/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [private]

  seed:
    build:
      context: .
      dockerfile: server/Dockerfile
    command: ["node", "seed/index.js"]
    profiles: [tools]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      DATABASE_SSL_MODE: disable
      JWT_SECRET: ${JWT_SECRET}
      CLIENT_ORIGIN: https://${SITE_DOMAIN}
      METRICS_ENABLED: "false"
      STORAGE_DRIVER: local
    networks: [private]

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
      args:
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:?VITE_GOOGLE_CLIENT_ID is required}
        VITE_AUTH_ALLOWED_EMAIL_DOMAIN: ${VITE_AUTH_ALLOWED_EMAIL_DOMAIN:-thapar.edu}
        VITE_PASSWORD_AUTH_ENABLED: ${VITE_PASSWORD_AUTH_ENABLED:-false}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    networks: [private]

  gateway:
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    depends_on: [client]
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?SITE_DOMAIN is required}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [private]

  prometheus:
    image: prom/prometheus:v3.13.1
    profiles: [observability]
    restart: unless-stopped
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus"]
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ./deploy/secrets/metrics-token:/run/secrets/metrics-token:ro
      - prometheus_data:/prometheus
    networks: [private]

  db-backup:
    image: postgres:17.10-alpine
    profiles: [ops]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: syncspace
      PGUSER: syncspace
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    volumes:
      - ./deploy/backup-postgres.sh:/scripts/backup-postgres.sh:ro
      - ./backups:/backups
    command: ["sh", "/scripts/backup-postgres.sh"]
    networks: [private]

networks:
  private:
    driver: bridge

volumes:
  postgres_data:
  minio_data:
  caddy_data:
  caddy_config:
  prometheus_data:
